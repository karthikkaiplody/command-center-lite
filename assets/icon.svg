<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#cba6f7"/>
      <stop offset="50%" style="stop-color:#f5c2e7"/>
      <stop offset="100%" style="stop-color:#89b4fa"/>
    </linearGradient>
    <linearGradient id="ringGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#cba6f7" stop-opacity="0.8"/>
      <stop offset="100%" style="stop-color:#89b4fa" stop-opacity="0.8"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background circle -->
  <circle cx="256" cy="256" r="248" fill="#1e1e2e"/>

  <!-- Subtle inner shadow ring -->
  <circle cx="256" cy="256" r="238" fill="none" stroke="#313244" stroke-width="2"/>

  <!-- Gradient accent ring -->
  <circle cx="256" cy="256" r="230" fill="none" stroke="url(#ringGradient)" stroke-width="3" stroke-dasharray="60 20 120 20" stroke-linecap="round"/>

  <!-- CC text -->
  <text
    x="256"
    y="310"
    text-anchor="middle"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="220"
    font-weight="700"
    letter-spacing="-18"
    fill="url(#textGradient)"
    filter="url(#glow)"
  >CC</text>

  <!-- Subtle bottom accent dots -->
  <circle cx="196" cy="390" r="5" fill="#cba6f7" opacity="0.6"/>
  <circle cx="256" cy="398" r="5" fill="#f5c2e7" opacity="0.6"/>
  <circle cx="316" cy="390" r="5" fill="#89b4fa" opacity="0.6"/>
</svg>
